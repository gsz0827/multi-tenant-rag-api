name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    name: Run Pytest API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rag_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      API_PREFIX: /api
      SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rag_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      EMBEDDING_PROVIDER: fake
      OPENAI_API_KEY: dummy-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Allure CLI
        run: |
          npm install -g allure
          allure --version

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Debug database connection
        run: |
          echo "DATABASE_URL=$DATABASE_URL"
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -U postgres \
            -d rag_test \
            -c "SELECT current_user, current_database();"

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -U postgres \
            -d rag_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: |
          echo "DATABASE_URL=$DATABASE_URL"
          alembic upgrade head

      - name: Run API tests
        run: |
          bash scripts/run_api_tests.sh

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: reports/allure-results
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: warn
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --cov=app --cov-report=term-missing
markers =
    unit: 单元测试（不依赖外部服务）
    api: 接口测试（FastAPI HTTP测试）
    integration: 集成测试（完整业务链路）
    smoke: 冒烟测试（核心功能快速验证）
    slow: 慢测试（RAG/embedding等耗时操作）